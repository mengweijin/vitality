spring:
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
          no-cache: true
          must-revalidate: true
  liquibase:
    contexts: prod
    change-log: classpath:/db/db.changelog-h2.yaml
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./h2/vita;AUTO_SERVER=TRUE;IGNORECASE=TRUE
    username: sa
    password:
  h2:
    console:
      # 是否允许网页访问，默认false
      enabled: false
      # h2数据库的访问路径：http://localhost:8080/h2（默认为/h2-console）
      path: /h2
      settings:
        # 是否允许从其他地方访问，还是只允许从本地访问
        web-allow-others: false
decorator:
  datasource:
    enabled: true
