spring:
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
          no-cache: true
          must-revalidate: true
  liquibase:
    contexts: dev
    change-log: classpath:/db/db.changelog-h2.yaml
  datasource:
    driver-class-name: org.h2.Driver
    # 以本地文件存储数据的方式使用H2数据库。./h2/test 在项目根路径下保存数据库文件
    # AUTO_SERVER=true 启动自动混合模式，允许开启多个连接，该参数不支持在内存中运行模式
    url: jdbc:h2:file:./h2/vita;AUTO_SERVER=TRUE;IGNORECASE=TRUE
    # jdbc:h2:file:C:/h2/vita;AUTO_SERVER=TRUE;IGNORECASE=TRUE
    # 以内存方式使用数据库（这里会创建一个数据库名为 vita 的数据库实例）
    # url: jdbc:h2:mem:vita;IGNORECASE=TRUE
    username: sa
    password:
  h2:
    console:
      # 是否允许网页访问，默认false
      enabled: true
      # h2数据库的访问路径：http://localhost:8080/h2（默认为/h2-console）
      path: /h2
      settings:
        # 是否允许从其他地方访问，还是只允许从本地访问
        web-allow-others: false
decorator:
  datasource:
    enabled: true
